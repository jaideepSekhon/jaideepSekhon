name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main, master]
    paths:
      - scripts/update-stats.mjs
      - scripts/update-stats.test.mjs
      - scripts/render-profile.mjs
      - profile.json
      - assets/tiger-outline.png
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check stats generation
        run: node --test scripts/update-stats.test.mjs
      - name: Generate stats from GitHub
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
      - name: Save updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg assets/terminal-mobile.svg data/languages.json LINKS.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile stats"
            git push
          fi
